{% extends "base.html" %}{% block title %}Saved places{% endblock %}{% block body %}<h1 class="ph">♥ Saved places</h1><p class="empty">Tap the ♡ on any city, church or landmark to save it here. Saved places stay in this browser.</p>
<div class="cards" id="fv"></div><script>document.addEventListener('DOMContentLoaded',async()=>{const ids=JSON.parse(localStorage.getItem('favs')||'[]'),box=document.getElementById('fv');if(!ids.length){box.innerHTML='<p class="empty">Nothing saved yet.</p>';return}
const r=await(await fetch('/api/items?ids='+ids.join(','))).json();r.forEach(i=>{const a=document.createElement('a');a.className='card';a.href=i.url;const h=document.createElement('h3');h.textContent=i.title;const p=document.createElement('p');p.textContent=i.description||'';const s=document.createElement('small');s.textContent=i.kind+' · '+i.rname;a.append(h,p,s);box.appendChild(a)})})</script>{% endblock %}
