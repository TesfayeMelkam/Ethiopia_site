{% extends "base.html" %}{% block title %}Quiz{% endblock %}{% block body %}<h1 class="ph">🧠 Ethiopia Quiz</h1>
<div class="card quiz" id="qz"></div><h2 class="sec">🏆 Leaderboard</h2><div class="card quiz">{% for s in top %}<div class="row"><span>{{ loop.index }}. {{ s.name }}</span><b>{{ s.score }}/{{ s.total }}</b></div>{% else %}<p class="empty">No scores yet. Be the first!</p>{% endfor %}</div><script type="application/json" id="qd">{{ Q|tojson }}</script>
<script>(()=>{const ALL=JSON.parse(document.getElementById('qd').textContent),pick=()=>ALL.slice().sort(()=>Math.random()-.5).slice(0,10);let Q=pick(),box=document.getElementById('qz');let i=0,s=0;
function ask(){const q=Q[i];box.innerHTML='';const h=document.createElement('h3');h.textContent=(i+1)+'/'+Q.length+'  '+q.q;box.appendChild(h);
 q.a.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{box.querySelectorAll('.opt').forEach((o,j)=>{o.disabled=true;if(j==q.c)o.classList.add('ok');else if(j==k)o.classList.add('no')});if(k==q.c)s++;
  const n=document.createElement('button');n.className='btn';n.textContent=i+1<Q.length?'Next →':'See score';n.onclick=()=>{i++;i<Q.length?ask():end()};box.appendChild(n)};box.appendChild(b)})}
function end(){box.innerHTML='<h2>Your score: '+s+' / '+Q.length+'</h2><p>'+(s>=8?'Excellent, you really know Ethiopia!':s>=5?'Good job! Explore the Know Ethiopia page to learn more.':'Keep exploring the site and try again!')+'</p>';const nm=document.createElement('input');nm.placeholder='Your name for the leaderboard';nm.maxLength=30;const sv=document.createElement('button');sv.className='btn small';sv.textContent='Save score';sv.onclick=async()=>{const fd=new FormData();fd.append('name',nm.value);fd.append('score',s);fd.append('total',Q.length);await fetch('/quiz/score',{method:'POST',headers:{'X-CSRF':document.querySelector('meta[name=csrf]').content},body:fd});sv.textContent='Saved ✓';sv.disabled=true};box.append(nm,sv);const b=document.createElement('button');b.className='btn';b.textContent='Play again';b.onclick=()=>{Q=pick();i=0;s=0;ask()};box.appendChild(b)}ask()})()</script>{% endblock %}
